<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2328">
  <title>TJ Car - Gestão da Oficina</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="menu" id="menu" aria-label="Navegação principal"></aside>
    <main class="conteudo">
      <header class="topo">
        <h1 id="titulo-pagina">Painel</h1>
        <div class="topo-acoes" id="topo-acoes"></div>
      </header>
      <section id="tela" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header class="modal-topo">
        <h2 id="modal-titulo"></h2>
        <button type="button" class="icone" id="modal-fechar" aria-label="Fechar">×</button>
      </header>
      <div id="modal-corpo"></div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
